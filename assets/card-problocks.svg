<svg xmlns="http://www.w3.org/2000/svg" width="380" height="260" viewBox="0 0 380 260">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ff8a4c"/><stop offset=".25" stop-color="#ff8a4c" stop-opacity=".05"/>
    <stop offset=".5" stop-color="#ff8a4c"/><stop offset=".75" stop-color="#ff8a4c" stop-opacity=".05"/><stop offset="1" stop-color="#ff8a4c"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-380 0" to="0 0" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff8a4c" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .h{font:800 24px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc} .s{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
  .b{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9} .tag{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .bd{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#ff8a4c;letter-spacing:1px}
  .gl{animation:br 5s ease-in-out infinite} @keyframes br{0%,100%{opacity:.55}50%{opacity:1}}
  .li{opacity:0;animation:up .6s ease-out forwards} @keyframes up{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
</style>
<rect x="1" y="1" width="378" height="258" rx="16" fill="#0d1117"/>
<rect class="gl" x="1" y="1" width="378" height="258" rx="16" fill="url(#gl)"/>
<rect x="1" y="1" width="378" height="258" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>
<text x="24" y="46" class="h">Problocks</text>
<text x="356" y="44" text-anchor="end" class="bd">3,100+ COMMITS</text>
<text x="24" y="70" class="s">K-12 learn / practice / play platform</text>
<g class="li" style="animation-delay:0.30s"><circle cx="30" cy="106" r="3.5" fill="#ff8a4c"/><text x="44" y="111" class="b">Live in classrooms, built solo</text></g><g class="li" style="animation-delay:0.55s"><circle cx="30" cy="136" r="3.5" fill="#ff8a4c"/><text x="44" y="141" class="b">4,610 questions, 116 explainer films</text></g><g class="li" style="animation-delay:0.80s"><circle cx="30" cy="166" r="3.5" fill="#ff8a4c"/><text x="44" y="171" class="b">AI lesson authoring + grading</text></g>
<rect x="24" y="214" width="71" height="24" rx="12" fill="#ff8a4c" fill-opacity=".12" stroke="#ff8a4c" stroke-opacity=".35"/><text x="34" y="230" class="tag" fill="#ff8a4c">Next.js</text><rect x="103" y="214" width="78" height="24" rx="12" fill="#ff8a4c" fill-opacity=".12" stroke="#ff8a4c" stroke-opacity=".35"/><text x="113" y="230" class="tag" fill="#ff8a4c">Supabase</text><rect x="190" y="214" width="78" height="24" rx="12" fill="#ff8a4c" fill-opacity=".12" stroke="#ff8a4c" stroke-opacity=".35"/><text x="200" y="230" class="tag" fill="#ff8a4c">Postgres</text>
