<svg xmlns="http://www.w3.org/2000/svg" width="380" height="260" viewBox="0 0 380 260">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#7c5cff"/><stop offset=".25" stop-color="#7c5cff" stop-opacity=".05"/>
    <stop offset=".5" stop-color="#7c5cff"/><stop offset=".75" stop-color="#7c5cff" stop-opacity=".05"/><stop offset="1" stop-color="#7c5cff"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-380 0" to="0 0" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .h{font:800 24px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc} .s{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
  .b{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9} .tag{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .bd{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#7c5cff;letter-spacing:1px}
  .gl{animation:br 5s ease-in-out infinite} @keyframes br{0%,100%{opacity:.55}50%{opacity:1}}
  .li{opacity:0;animation:up .6s ease-out forwards} @keyframes up{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
</style>
<rect x="1" y="1" width="378" height="258" rx="16" fill="#0d1117"/>
<rect class="gl" x="1" y="1" width="378" height="258" rx="16" fill="url(#gl)"/>
<rect x="1" y="1" width="378" height="258" rx="16" fill="none" stroke="url(#bd)" stroke-width="2"/>
<text x="24" y="46" class="h">Verbalytics</text>
<text x="356" y="44" text-anchor="end" class="bd">SPONSORED CAPSTONE</text>
<text x="24" y="70" class="s">AI training for dental teams</text>
<g class="li" style="animation-delay:0.30s"><circle cx="30" cy="106" r="3.5" fill="#7c5cff"/><text x="44" y="111" class="b">Simulated AI patients</text></g><g class="li" style="animation-delay:0.55s"><circle cx="30" cy="136" r="3.5" fill="#7c5cff"/><text x="44" y="141" class="b">Whole-conversation grading</text></g><g class="li" style="animation-delay:0.80s"><circle cx="30" cy="166" r="3.5" fill="#7c5cff"/><text x="44" y="171" class="b">CI/CD, one-click rollback</text></g>
<rect x="24" y="214" width="56" height="24" rx="12" fill="#7c5cff" fill-opacity=".12" stroke="#7c5cff" stroke-opacity=".35"/><text x="34" y="230" class="tag" fill="#7c5cff">React</text><rect x="88" y="214" width="78" height="24" rx="12" fill="#7c5cff" fill-opacity=".12" stroke="#7c5cff" stroke-opacity=".35"/><text x="98" y="230" class="tag" fill="#7c5cff">Supabase</text><rect x="175" y="214" width="93" height="24" rx="12" fill="#7c5cff" fill-opacity=".12" stroke="#7c5cff" stroke-opacity=".35"/><text x="185" y="230" class="tag" fill="#7c5cff">ElevenLabs</text>
</svg>
